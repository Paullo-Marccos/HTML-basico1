<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

                    <title>Formulario</title>
                
</head>
<body>
    <h1>Formulário</h1>
        <div style="font-size: 25px;">
        <form>
            <!--Nome-->
            <label for="Nome">Nome:</label>
            <input id="Nome" type="name" placeholder="Digite o seu nome" required>

            <br><br>

            <!--Email-->
            <label for="Email">Email:</label>
            <input id="Email" type="email" placeholder="Digite um Email"required>

            <br><br>
            <!--Senha-->
            <label for="Senha">Senha:</label>
            <input id="Senha" type="password" placeholder="Digite uma Senha" required>

            <br><br>

            <!--Escolha um!-->
            <h4>Quatro figuras aguardam na sombra.<br>Escolha uma aquela que marcou a história, deixou uma pergunta sem resposta e ainda caminha entre os ecos do passado.</h2>

            
            <input id="1378" type="radio" name="1378" value="O Flautista de Hamelin" required>
            <label  for="1378">O Flautista de Hamelin</label>
                <br>
            <input id="1532" type="radio" name="1378" value="O Homem da Capa Cinzenta" required>
            <label for="1532">O Homem da Capa Cinzenta</label>
                <br>
            <input id="3214" type="radio" name="1378" value="O Viajante Sem Rosto" required>
            <label for="3214">O Viajante Sem Rosto</label>
                <br>
            <input id="5564" type="radio" name="1378" value="O Mestre dos Sussurros" required>
            <label for="5564">O Mestre dos Sussurros</label>
            
                <br>

            <h4>Do que voce tem medo?</h4>

            <input id="1" type="checkbox" name="1" value="Seres Humanos">
            <label for="1">Seres Humanos</label>
            <br>
            <input id="2" type="checkbox" name="2" value="Entidades">
            <label for="2">Entidades</label>
            <br>
            <input id="3" type="checkbox" name="3" value="Não possuo medo">
            <label for="3">Não possuo medo</label>

            <br>

            <h4>Quatro objeos</h4>

            <select>
                <option selected disabled value="Escolha apenas um">Escolha apenas um</option>
                <option value="Flauta">Flauta</option>
                <option value="Capa">Capa</option>
                <option value="Espelho">Espelho</option>
                <option value="Chave">Chave</option>
            </select>
            <!--Botao de enviar-->
            <br>
            <h4>???</h4>
            <textarea placeholder="Digite o que lhe chama a ateção..." rows="5" cols="55"></textarea>
            <br><br>    
            <input type="submit" value="Enviar Formulário">

            
        </form>
         <br><br>

        </div>
